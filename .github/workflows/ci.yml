name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The panel uses `glassEffect` (macOS 26 SDK) behind `#available`; `#available` does not remove the
    # symbol at compile time, so the build needs the macOS 26 SDK, i.e. Xcode 26 or newer.
    # Pin the runner image instead of `macos-latest`, which moves between macOS versions.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26+
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 found on this runner:"; ls -d /Applications/Xcode*; exit 1
          fi
          sudo xcode-select -s "$XCODE"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version
      # Shell tests open real AppKit windows; this needs a GUI login session (hosted macOS runners
      # provide one). Unverified for this repo until the first CI run.
      - name: Test
        run: swift test
      - name: Build app bundle (ad-hoc signed)
        run: ./scripts/build-app.sh
