name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The panel uses `glassEffect` (macOS 26 SDK) behind `#available`; `#available` does not remove the
    # symbol at compile time, so the build needs the macOS 26 SDK, i.e. Xcode 26 or newer.
    # Pin the runner image instead of `macos-latest`, which moves between macOS versions.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26+
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 found on this runner:"; ls -d /Applications/Xcode*; exit 1
          fi
          sudo xcode-select -s "$XCODE"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version
          # Window tests can depend on it: hosted runners may have Reduce Transparency on.
          swift -e 'import AppKit; print("Reduce Transparency:", NSWorkspace.shared.accessibilityDisplayShouldReduceTransparency)'
      # Shell tests open real AppKit windows; this needs a GUI login session. Hosted macOS runners provide one
      # (verified: all tests passed on macos-26 with Xcode 26.6 on 2026-11-21).
      - name: Test
        shell: bash   # -eo pipefail, so a failing `swift test` is not hidden by `tee`
        run: |
          swift test 2>&1 | tee swift-test.log
          # A test process that exits 0 early (say, code under test calling exit(0)) would pass silently. Require a
          # passing Swift Testing summary for every run that started (some toolchains run both test targets in one
          # process, others in one each) and a floor on the total. Neither target reaches the floor alone, so a target
          # that never ran fails too; keep it that way when raising the floor.
          summary='Test run with [0-9]+ tests? in [0-9]+ suites? passed'
          started="$(grep -c 'Test run started' swift-test.log || true)"
          runs="$(grep -cE "$summary" swift-test.log || true)"
          total="$({ grep -oE "$summary" swift-test.log || true; } | awk '{ n += $4 } END { print n + 0 }')"
          echo "Swift Testing: $started runs started, $runs passed, $total tests"
          if [ "$runs" -lt 1 ] || [ "$runs" -ne "$started" ] || [ "$total" -lt 330 ]; then
            echo "::error::Expected every started Swift Testing run to pass, with at least 330 tests in total"; exit 1
          fi
      - name: Build app bundle (ad-hoc signed)
        run: ./scripts/build-app.sh
