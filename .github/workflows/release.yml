name: Release

# Pushing a tag like v0.1.0 builds Pastu.app, zips it, publishes a GitHub prerelease with the zip and its
# SHA-256, then updates Casks/pastu.rb on main. Uses only the built-in GITHUB_TOKEN; no other secrets.
# The build is ad-hoc signed, not notarized.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26+
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 found on this runner:"; ls -d /Applications/Xcode*; exit 1
          fi
          sudo xcode-select -s "$XCODE"
      - name: Read version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1
          fi
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$PLIST" != "$VERSION" ]; then
            echo "Resources/Info.plist says $PLIST but the tag says $VERSION"; exit 1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$VERSION] section"; exit 1; }
          # An empty section would publish release notes with nothing in them.
          ENTRIES="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^- / { n++ }
            END { print n + 0 }
          ' CHANGELOG.md)"
          [ "$ENTRIES" -gt 0 ] || { echo "CHANGELOG.md [$VERSION] section has no entries"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test
        shell: bash   # -eo pipefail, so a failing `swift test` is not hidden by `tee`
        run: |
          swift test 2>&1 | tee swift-test.log
          # Same check as in ci.yml, see the comment there: every started run passed, at least 420 tests.
          summary='Test run with [0-9]+ tests? in [0-9]+ suites? passed'
          started="$(grep -c 'Test run started' swift-test.log || true)"
          runs="$(grep -cE "$summary" swift-test.log || true)"
          total="$({ grep -oE "$summary" swift-test.log || true; } | awk '{ n += $4 } END { print n + 0 }')"
          echo "Swift Testing: $started runs started, $runs passed, $total tests"
          if [ "$runs" -lt 1 ] || [ "$runs" -ne "$started" ] || [ "$total" -lt 420 ]; then
            echo "::error::Expected every started Swift Testing run to pass, with at least 420 tests in total"; exit 1
          fi
      - name: Build app bundle (ad-hoc signed)
        run: VERSION="${{ steps.version.outputs.version }}" ./scripts/build-app.sh
      - name: Package
        id: package
        run: |
          ZIP="Pastu-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Pastu.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "$ZIP.sha256")" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "> **Early prototype.** This build is **not signed with an Apple Developer ID and not notarized**."
            echo "> On first launch macOS will say it cannot verify the developer: open **System Settings → Privacy & Security**,"
            echo "> click **Open Anyway** for Pastu and confirm. Do not disable Gatekeeper. Requires **macOS 15+**, Apple Silicon."
            echo ""
            echo "SHA-256 of \`${{ steps.package.outputs.zip }}\`: \`${{ steps.package.outputs.sha }}\`"
            echo ""
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[.*\]: / { exit }
              on { print }
            ' CHANGELOG.md
            echo ""
            echo "### Known limitations and unverified areas"
            echo "- Not signed with a Developer ID and not notarized; Accessibility may need to be granted again after an update."
            echo "- The history (including copied pictures and screenshots) is stored unencrypted, protected by file permissions only."
            echo "- Not yet checked by hand on every Mac: the Liquid Glass look and Dark mode, dragging clips and the paste"
            echo "  queue into other apps, the menu bar items, multiple displays, full-screen apps and Spaces."
            echo "- Reading the text in pictures has been tried on generated test images, not on a wide range of real screenshots."
            echo "- How the macOS 15.4+ clipboard-privacy prompt treats Pastu has not been observed."
            echo "- The panel opens in about 30–45 ms of main-thread work (docs/performance.md); idle memory, about 100 MB, is"
            echo "  higher than it should be. The source app of a clip is a best guess."
            echo "- Search terms shorter than 3 characters are case-insensitive for ASCII letters only."
            echo "- Apple Silicon only; the app icon is temporary."
          } > notes.md
          cat notes.md
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.zip }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pastu ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --prerelease --verify-tag
      - name: Update the Homebrew cask
        # The cask lives in this repository (Casks/pastu.rb), so one tag updates the release and `brew install`.
        # Pre-release tags such as v1.0.0-beta.1 are skipped: the cask follows stable versions only.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then echo "Pre-release tag, leaving the cask alone"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          ./scripts/update-cask.sh "$VERSION" "${{ steps.package.outputs.sha }}"
          if git diff --quiet; then echo "Cask already at $VERSION"; exit 0; fi
          git commit -am "Update the Homebrew cask to $VERSION"
          for attempt in 1 2 3; do
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Could not push the cask update; the release itself is published. Run scripts/update-cask.sh by hand."
          exit 1
