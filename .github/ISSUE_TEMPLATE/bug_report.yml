name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste clipboard contents that are private. For security problems, see SECURITY.md instead of filing a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 15.4 or 26.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pastu version or commit
      placeholder: "e.g. 0.1.0 or a commit hash"
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions
      description: Tick what applies
      options:
        - label: Pastu is enabled in System Settings > Privacy & Security > Accessibility
        - label: I rebuilt the app from source since I granted Accessibility (an ad-hoc signature resets it; see CONTRIBUTING.md)
        - label: macOS asked about clipboard access (15.4+) and I allowed it
        - label: The panel footer says "Copies only"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy ...
        2. Press ⌘⇧V ...
        3. ...
    validations:
      required: true
