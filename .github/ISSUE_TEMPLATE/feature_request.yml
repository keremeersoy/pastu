name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This does not need network access, telemetry or a new dependency (or I explain why above)
